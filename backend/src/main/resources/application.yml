spring:
  application:
    name: habichat-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/habichat
    driver-class-name: org.postgresql.Driver
    username: habichat
    password: habichat

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true

server:
  port: 8080

habichat:
  room:
    expiry-hours: 24
    creation-rate-limit-per-ip-per-hour: 3
  message:
    retention-limit: 150