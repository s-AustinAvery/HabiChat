spring:
  application:
    name: chat-app-backend

  datasource:
    url: jdbc:h2:mem:chatapp;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

chatapp:
  room:
    expiry-hours: 24
    creation-rate-limit-per-ip-per-hour: 3
  message:
    retention-limit: 150